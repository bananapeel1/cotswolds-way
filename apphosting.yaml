# Firebase App Hosting configuration
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Public env vars — safe to inline; needed at build time so NEXT_PUBLIC_* gets baked in.
  - variable: NEXT_PUBLIC_SUPABASE_URL
    value: https://japnxbkdcbqzospadsyt.supabase.co
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SUPABASE_ANON_KEY
    secret: NEXT_PUBLIC_SUPABASE_ANON_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_MAPBOX_TOKEN
    secret: NEXT_PUBLIC_MAPBOX_TOKEN
    availability:
      - BUILD
      - RUNTIME

  # Server-only secrets — never exposed to the browser.
  - variable: SUPABASE_SERVICE_ROLE_KEY
    secret: SUPABASE_SERVICE_ROLE_KEY
    availability:
      - RUNTIME

  # Google AI Studio key for the Gemini-powered trip planner.
  # Store the value in Google Secret Manager under the name GEMINI_API_KEY:
  #   firebase apphosting:secrets:set GEMINI_API_KEY
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME

  # GraphHopper routing service URL (private Cloud Run service). The
  # /api/routes/generate endpoint calls this to produce circular walks.
  # Set the value via:
  #   firebase apphosting:secrets:set GRAPHHOPPER_URL
  # Value format: https://cotswolds-graphhopper-<hash>-nw.a.run.app  (no trailing slash)
  - variable: GRAPHHOPPER_URL
    secret: GRAPHHOPPER_URL
    availability:
      - RUNTIME

  # Booking.com integration disabled until credentials are issued.
  # When ready, add BOOKING_API_TOKEN and BOOKING_AFFILIATE_ID as
  # secrets and BOOKING_API_BASE_URL as a value here.
